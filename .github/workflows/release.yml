name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json;print(json.load(open('custom_components/zyxel_router/manifest.json'))['version'])")
          if [ "$tag" != "$ver" ]; then echo "Tag $tag != manifest $ver"; exit 1; fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found=1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "No entry for $tag in CHANGELOG.md"; exit 1
          fi
          echo "" >> release_notes.md
          echo "**Full changelog:** [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)" >> release_notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
