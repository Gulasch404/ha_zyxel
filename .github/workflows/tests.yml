name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install pytest-homeassistant-custom-component ruff
      - name: Lint
        run: ruff check custom_components tests tools
      - name: Translations up to date
        run: |
          python tools/gen_translations.py
          git diff --exit-code custom_components/zyxel_router/strings.json custom_components/zyxel_router/translations
      - name: Tests
        run: pytest -q
